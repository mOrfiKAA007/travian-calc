<!DOCTYPE html>
<html lang="hu">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Travian Oázis & Farm Kalkulátor (Online)</title>
    
    <!-- Firebase SDK betöltése -->
    <script src="https://www.gstatic.com/firebasejs/9.22.2/firebase-app-compat.js"></script>
    <script src="https://www.gstatic.com/firebasejs/9.22.2/firebase-database-compat.js"></script>

    <style>
        body { font-family: Arial, sans-serif; background-color: #f4f1ea; color: #333; margin: 0; padding: 15px; }
        .container { max-width: 950px; margin: 0 auto; background: #fff; padding: 15px 20px; border-radius: 8px; box-shadow: 0 4px 8px rgba(0,0,0,0.1); }
        h1, h2 { color: #4a3828; border-bottom: 2px solid #7a6148; padding-bottom: 5px; font-size: 20px; }
        
        /* Globális Összesítő Doboz a tetején */
        .global-summary-container { background-color: #fdfbf7; border: 2px solid #7a6148; padding: 15px; border-radius: 6px; margin-bottom: 20px; }
        .global-summary-grid { display: grid; grid-template-columns: repeat(auto-fit, minmax(250px, 1fr)); gap: 10px; margin-top: 10px; }
        .village-summary-card { background: #fff; border: 1px solid #dcd6cd; padding: 10px; border-radius: 5px; font-size: 13px; }
        .village-summary-card h4 { margin: 0 0 6px 0; color: #4a3828; border-bottom: 1px solid #eee; padding-bottom: 3px; }
        
        .global-actions { margin-top: 12px; display: flex; justify-content: space-between; align-items: center; flex-wrap: wrap; gap: 10px; }
        button.global-calc-btn { background-color: #4a3828; color: white; padding: 10px 18px; border: none; border-radius: 4px; font-size: 14px; cursor: pointer; font-weight: bold; }
        button.global-calc-btn:hover { background-color: #35271c; }

        /* Fülek stílusa */
        .tabs { display: flex; flex-wrap: wrap; gap: 5px; margin-bottom: 15px; border-bottom: 2px solid #7a6148; padding-bottom: 8px; }
        .tab-btn { background-color: #dcd6cd; border: none; padding: 8px 14px; cursor: pointer; font-weight: bold; border-radius: 4px 4px 0 0; color: #4a3828; font-size: 14px; transition: background-color 0.2s; }
        .tab-btn:hover { background-color: #c8beaf; }
        .tab-btn.active { background-color: #7a6148; color: white; }

        .tab-content { display: none; }
        .tab-content.active { display: block; }

        .section { margin-bottom: 20px; }
        label { font-weight: bold; display: inline-block; margin-bottom: 5px; }
        input[type="number"], textarea { padding: 8px; border: 1px solid #ccc; border-radius: 4px; font-size: 14px; box-sizing: border-box; }
        .inline-inputs { display: flex; gap: 20px; align-items: flex-start; flex-wrap: wrap; }
        .coord-input { width: 60px; }

        textarea { width: 100%; height: 110px; font-family: monospace; resize: vertical; }
        button.calc-btn { background-color: #5b7e28; color: white; padding: 12px 20px; border: none; border-radius: 4px; font-size: 16px; cursor: pointer; font-weight: bold; width: 100%; }
        button.calc-btn:hover { background-color: #48641f; }
        
        table { width: 100%; border-collapse: collapse; margin-top: 15px; font-size: 13px; }
        th, td { border: 1px solid #ddd; padding: 6px 8px; text-align: center; vertical-align: middle; }
        th { background-color: #7a6148; color: white; }
        tr:nth-child(even) { background-color: #f9f9f9; }
        
        .unit-checkboxes-row { display: flex; gap: 10px; justify-content: center; flex-wrap: wrap; font-size: 12px; }
        .unit-checkboxes-row label { font-weight: normal; cursor: pointer; display: flex; align-items: center; gap: 3px; }

        .summary-box { background-color: #e8f0d8; border: 1px solid #b2d281; padding: 12px; border-radius: 5px; margin-top: 15px; font-size: 15px; }
        .help-text { font-size: 12px; color: #666; margin-top: 4px; }
        #syncStatus { font-size: 11px; color: #666; float: right; margin-top: 5px; }
    </style>
</head>
<body onload="initApp()">

<div class="container">
    <h1>Travian Oázis & Farm Kalkulátor - by mOrfi <span id="syncStatus">Kapcsolódás...</span></h1>
    
    <!-- Központi Összesítő a tetején -->
    <div class="global-summary-container">
        <h2>📊 Minden Falu Összesített Áttekintése</h2>
        <div class="global-summary-grid" id="globalSummaryGrid">
            <!-- Ide generálódnak a kártyák -->
        </div>
        <div class="global-actions">
            <button class="global-calc-btn" onclick="calculateAllVillages()">🔄 Minden falu számítása / frissítése</button>
            <span class="help-text">Itt látható az összes falu státusza anélkül, hogy váltogatnod kellene a füleket.</span>
        </div>
    </div>

    <!-- Fülek gombjai -->
    <div class="tabs" id="tabButtons">
        <button class="tab-btn active" onclick="switchTab(0)">1. Falu</button>
        <button class="tab-btn" onclick="switchTab(1)">2. Falu</button>
        <button class="tab-btn" onclick="switchTab(2)">3. Falu</button>
        <button class="tab-btn" onclick="switchTab(3)">4. Falu</button>
        <button class="tab-btn" onclick="switchTab(4)">5. Falu</button>
        <button class="tab-btn" onclick="switchTab(5)">6. Falu</button>
        <button class="tab-btn" onclick="switchTab(6)">7. Falu</button>
    </div>

    <!-- A 7 falu konténere -->
    <div id="tabContentsContainer"></div>
</div>

<script>
    // --- FIREBASE ADATOK ---
    const firebaseConfig = {
        apiKey: "AIzaSyCsGGSJjxGEkn6Ciid3S9378bifnvmwzGU",
        authDomain: "travian-farm-calc.firebaseapp.com",
        databaseURL: "https://travian-farm-calc-default-rtdb.europe-west1.firebasedatabase.app/",
        projectId: "travian-farm-calc",
        storageBucket: "travian-farm-calc.firebasestorage.app",
        messagingSenderId: "194959845188",
        appId: "G-6167TT4H7S"
    };

    firebase.initializeApp(firebaseConfig);
    const db = firebase.database();
    const dbRef = db.ref('travianData');

    const totalTabs = 7;
    let isRemoteUpdate = false; 
    let globalAppData = []; 

    const SPEEDS = {
        sztyeppe: 16,
        mesterlovesz: 15,
        martaloc: 14
    };

    function initApp() {
        const container = document.getElementById('tabContentsContainer');
        container.innerHTML = '';

        for (let i = 0; i < totalTabs; i++) {
            const tabDiv = document.createElement('div');
            tabDiv.className = `tab-content ${i === 0 ? 'active' : ''}`;
            tabDiv.id = `tabContent_${i}`;
            
            tabDiv.innerHTML = `
                <div class="section">
                    <h2>1. Alapbeállítások</h2>
                    <div class="inline-inputs">
                        <div>
                            <label>Start (X|Y):</label><br>
                            <input type="number" id="startX_${i}" class="coord-input" value="0" oninput="saveData()">
                            <input type="number" id="startY_${i}" class="coord-input" value="0" oninput="saveData()">
                        </div>
                        <div>
                            <label for="interval_${i}">Indítás (perc):</label><br>
                            <input type="number" id="interval_${i}" value="6" min="1" style="width: 70px;" oninput="saveData()">
                        </div>
                    </div>
                </div>

                <div class="section">
                    <h2>2. Cél oázisok (max 100 db)</h2>
                    <p class="help-text">Soronként egy koordináta, pl: <b>12|-34</b></p>
                    <textarea id="targetCoords_${i}" placeholder="12|-34&#10;15|-30&#10;-5|20" oninput="saveData()"></textarea>
                </div>

                <div class="section">
                    <h2>2.B. Cél Farm faluk (max 100 db)</h2>
                    <p class="help-text">Soronként egy koordináta, pl: <b>12|-34</b></p>
                    <textarea id="farmCoords_${i}" placeholder="10|-20&#10;11|-22" oninput="saveData()"></textarea>
                </div>

                <button class="calc-btn" onclick="calculate(${i})">Számítás és Táblázat frissítése</button>

                <div class="section" id="resultsSection_${i}" style="display:none;">
                    <h2>3. Eredmények</h2>
                    
                    <h3>🌿 Oázisok</h3>
                    <div class="summary-box" id="summary_oasis_${i}"></div>
                    <div style="overflow-x:auto;">
                        <table>
                            <thead>
                                <tr>
                                    <th>#</th>
                                    <th>Cél Oázis</th>
                                    <th>Táv (mező)</th>
                                    <th>Küldött egységek (Pipáld ki)</th>
                                    <th>Idő (oda-vissza)</th>
                                    <th>Szükséges lóigény</th>
                                </tr>
                            </thead>
                            <tbody id="resultsTableBody_oasis_${i}"></tbody>
                        </table>
                    </div>

                    <h3 style="margin-top: 25px;">🌾 Farm faluk</h3>
                    <div class="summary-box" id="summary_farm_${i}"></div>
                    <div style="overflow-x:auto;">
                        <table>
                            <thead>
                                <tr>
                                    <th>#</th>
                                    <th>Cél Farm</th>
                                    <th>Táv (mező)</th>
                                    <th>Küldött egységek (Pipáld ki)</th>
                                    <th>Ló darabszám (kézi)</th>
                                    <th>Idő (oda-vissza)</th>
                                    <th>Szükséges lóigény</th>
                                </tr>
                            </thead>
                            <tbody id="resultsTableBody_farm_${i}"></tbody>
                        </table>
                    </div>
                </div>
            `;
            container.appendChild(tabDiv);
        }

        dbRef.on('value', (snapshot) => {
            const data = snapshot.val();
            if (data) {
                isRemoteUpdate = true;
                globalAppData = data;
                updateFieldsFromData(data);
                isRemoteUpdate = false;
                document.getElementById('syncStatus').innerText = '🟢 Szinkronizálva';
            } else {
                document.getElementById('syncStatus').innerText = '⚪ Nincs még adat';
            }
        }, (error) => {
            document.getElementById('syncStatus').innerText = '🔴 Hiba a kapcsolatban';
            console.error(error);
        });
    }

    function switchTab(index) {
        const buttons = document.querySelectorAll('.tab-btn');
        buttons.forEach((btn, idx) => {
            btn.classList.toggle('active', idx === index);
        });

        const contents = document.querySelectorAll('.tab-content');
        contents.forEach((content, idx) => {
            content.classList.toggle('active', idx === index);
        });
    }

    function saveData() {
        if (isRemoteUpdate) return; 

        const allData = [];
        for (let i = 0; i < totalTabs; i++) {
            let unitsConfig = (globalAppData[i] && globalAppData[i].unitsConfig) ? globalAppData[i].unitsConfig : {};
            let farmConfig = (globalAppData[i] && globalAppData[i].farmConfig) ? globalAppData[i].farmConfig : {};

            allData.push({
                startX: document.getElementById(`startX_${i}`).value,
                startY: document.getElementById(`startY_${i}`).value,
                interval: document.getElementById(`interval_${i}`).value,
                targetCoords: document.getElementById(`targetCoords_${i}`).value,
                farmCoords: document.getElementById(`farmCoords_${i}`).value,
                unitsConfig: unitsConfig,
                farmConfig: farmConfig
            });
        }
        
        globalAppData = allData;
        dbRef.set(allData).then(() => {
            document.getElementById('syncStatus').innerText = '🟢 Mentve';
            updateGlobalSummaryCards();
        }).catch((error) => {
            document.getElementById('syncStatus').innerText = '🔴 Mentési hiba';
        });
    }

    function updateFieldsFromData(allData) {
        allData.forEach((data, i) => {
            if (document.getElementById(`startX_${i}`)) {
                if (data.startX !== undefined) document.getElementById(`startX_${i}`).value = data.startX;
                if (data.startY !== undefined) document.getElementById(`startY_${i}`).value = data.startY;
                if (data.interval !== undefined) document.getElementById(`interval_${i}`).value = data.interval;
                if (data.targetCoords !== undefined) document.getElementById(`targetCoords_${i}`).value = data.targetCoords;
                if (data.farmCoords !== undefined) document.getElementById(`farmCoords_${i}`).value = data.farmCoords;
                
                const resultsSection = document.getElementById(`resultsSection_${i}`);
                if (resultsSection && resultsSection.style.display !== 'none') {
                    calculate(i);
                }
            }
        });
        updateGlobalSummaryCards();
    }

    function parseCoords(rawText) {
        const lines = rawText.split('\n');
        const targets = [];
        const coordRegex = /(-?\d+)[\s|,|\/]+(-?\d+)/;

        for (let line of lines) {
            line = line.trim();
            if (!line) continue;
            const match = line.match(coordRegex);
            if (match) {
                targets.push({ x: parseFloat(match[1]), y: parseFloat(match[2]) });
            }
            if (targets.length >= 100) break;
        }
        return targets;
    }

    function calculate(i) {
        const startX = parseFloat(document.getElementById(`startX_${i}`).value) || 0;
        const startY = parseFloat(document.getElementById(`startY_${i}`).value) || 0;

        const oasisTargets = parseCoords(document.getElementById(`targetCoords_${i}`).value);
        const farmTargets = parseCoords(document.getElementById(`farmCoords_${i}`).value);

        if (oasisTargets.length === 0 && farmTargets.length === 0) { 
            alert('Nem található érvényes koordináta (sem oázis, sem farm) ezen a fülön!'); 
            return; 
        }

        let savedUnitsConfig = (globalAppData[i] && globalAppData[i].unitsConfig) ? globalAppData[i].unitsConfig : {};
        let savedFarmConfig = (globalAppData[i] && globalAppData[i].farmConfig) ? globalAppData[i].farmConfig : {};

        // --- OÁZISOK TÁBLÁZAT ---
        const oasisTbody = document.getElementById(`resultsTableBody_oasis_${i}`);
        oasisTbody.innerHTML = '';

        oasisTargets.forEach((target, index) => {
            const dx = startX - target.x;
            const dy = startY - target.y;
            const distance = Math.sqrt(dx * dx + dy * dy);
            const coordKey = `${target.x}|${target.y}`;
            
            let isSztyChecked = true;
            let isMestChecked = false;
            let isMartChecked = false;

            if (savedUnitsConfig[coordKey] !== undefined) {
                isSztyChecked = !!savedUnitsConfig[coordKey].szty;
                isMestChecked = !!savedUnitsConfig[coordKey].mest;
                isMartChecked = !!savedUnitsConfig[coordKey].mart;
            }

            const row = document.createElement('tr');
            row.id = `oasis_row_${i}_${index}`;
            row.dataset.coordKey = coordKey;
            row.innerHTML = `
                <td>${index + 1}</td>
                <td>(${target.x}|${target.y})</td>
                <td id="oasis_dist_${i}_${index}">${distance.toFixed(2)}</td>
                <td>
                    <div class="unit-checkboxes-row">
                        <label><input type="checkbox" id="oasis_szty_${i}_${index}" ${isSztyChecked ? 'checked' : ''} onchange="onOasisChange(${i}, ${index}, ${distance})"> Sztyeppe</label>
                        <label><input type="checkbox" id="oasis_mest_${i}_${index}" ${isMestChecked ? 'checked' : ''} onchange="onOasisChange(${i}, ${index}, ${distance})"> Mesterlövész</label>
                        <label><input type="checkbox" id="oasis_mart_${i}_${index}" ${isMartChecked ? 'checked' : ''} onchange="onOasisChange(${i}, ${index}, ${distance})"> Martalóc</label>
                    </div>
                </td>
                <td id="oasis_time_${i}_${index}">-</td>
                <td id="oasis_horses_${i}_${index}">-</td>
            `;
            oasisTbody.appendChild(row);
            updateOasisRowCalculation(i, index, distance, false);
        });

        // --- FARMOK TÁBLÁZAT ---
        const farmTbody = document.getElementById(`resultsTableBody_farm_${i}`);
        farmTbody.innerHTML = '';

        farmTargets.forEach((target, index) => {
            const dx = startX - target.x;
            const dy = startY - target.y;
            const distance = Math.sqrt(dx * dx + dy * dy);
            const coordKey = `${target.x}|${target.y}`;
            
            let isSztyChecked = true;
            let isMestChecked = false;
            let isMartChecked = false;
            let horseCount = 1;

            if (savedFarmConfig[coordKey] !== undefined) {
                isSztyChecked = !!savedFarmConfig[coordKey].szty;
                isMestChecked = !!savedFarmConfig[coordKey].mest;
                isMartChecked = !!savedFarmConfig[coordKey].mart;
                if (savedFarmConfig[coordKey].horses !== undefined) {
                    horseCount = parseInt(savedFarmConfig[coordKey].horses) || 1;
                }
            }

            const row = document.createElement('tr');
            row.id = `farm_row_${i}_${index}`;
            row.dataset.coordKey = coordKey;
            row.innerHTML = `
                <td>${index + 1}</td>
                <td>(${target.x}|${target.y})</td>
                <td id="farm_dist_${i}_${index}">${distance.toFixed(2)}</td>
                <td>
                    <div class="unit-checkboxes-row">
                        <label><input type="checkbox" id="farm_szty_${i}_${index}" ${isSztyChecked ? 'checked' : ''} onchange="onFarmChange(${i}, ${index}, ${distance})"> Sztyeppe</label>
                        <label><input type="checkbox" id="farm_mest_${i}_${index}" ${isMestChecked ? 'checked' : ''} onchange="onFarmChange(${i}, ${index}, ${distance})"> Mesterlövész</label>
                        <label><input type="checkbox" id="farm_mart_${i}_${index}" ${isMartChecked ? 'checked' : ''} onchange="onFarmChange(${i}, ${index}, ${distance})"> Martalóc</label>
                    </div>
                </td>
                <td>
                    <input type="number" id="farm_count_${i}_${index}" value="${horseCount}" min="1" style="width: 60px; text-align: center;" oninput="onFarmChange(${i}, ${index}, ${distance})">
                </td>
                <td id="farm_time_${i}_${index}">-</td>
                <td id="farm_horses_${i}_${index}">-</td>
            `;
            farmTbody.appendChild(row);
            updateFarmRowCalculation(i, index, distance, false);
        });

        document.getElementById(`resultsSection_${i}`).style.display = 'block';
        updateTotalSummary(i);
        updateGlobalSummaryCards();
    }

    function calculateAllVillages() {
        for (let i = 0; i < totalTabs; i++) {
            const rawOasis = document.getElementById(`targetCoords_${i}`).value;
            const rawFarm = document.getElementById(`farmCoords_${i}`).value;
            if ((rawOasis && rawOasis.trim() !== '') || (rawFarm && rawFarm.trim() !== '')) {
                calculate(i);
            }
        }
        updateGlobalSummaryCards();
        alert('Minden falu számítása frissítve!');
    }

    function onOasisChange(tabIdx, rowIdx, distance) {
        updateOasisRowCalculation(tabIdx, rowIdx, distance, true);
    }

    function updateOasisRowCalculation(tabIdx, rowIdx, distance, shouldSave) {
        const row = document.getElementById(`oasis_row_${tabIdx}_${rowIdx}`);
        const coordKey = row.dataset.coordKey;

        const useSzty = document.getElementById(`oasis_szty_${tabIdx}_${rowIdx}`).checked;
        const useMest = document.getElementById(`oasis_mest_${tabIdx}_${rowIdx}`).checked;
        const useMart = document.getElementById(`oasis_mart_${tabIdx}_${rowIdx}`).checked;

        const timeCell = document.getElementById(`oasis_time_${tabIdx}_${rowIdx}`);
        const horsesCell = document.getElementById(`oasis_horses_${tabIdx}_${rowIdx}`);

        if (!globalAppData[tabIdx]) globalAppData[tabIdx] = {};
        if (!globalAppData[tabIdx].unitsConfig) globalAppData[tabIdx].unitsConfig = {};
        globalAppData[tabIdx].unitsConfig[coordKey] = { szty: useSzty, mest: useMest, mart: useMart };

        if (shouldSave) saveData();

        if (!useSzty && !useMest && !useMart) {
            timeCell.innerText = 'Válassz egységet!';
            horsesCell.innerText = '-';
            updateTotalSummary(tabIdx);
            updateGlobalSummaryCards();
            return;
        }

        let activeSpeeds = [];
        if (useSzty) activeSpeeds.push(SPEEDS.sztyeppe);
        if (useMest) activeSpeeds.push(SPEEDS.mesterlovesz);
        if (useMart) activeSpeeds.push(SPEEDS.martaloc);

        const slowestSpeed = Math.min(...activeSpeeds);
        const travelTimeMinutes = (distance / slowestSpeed) * 60;
        const roundTripMinutes = travelTimeMinutes * 2;
        const horsesNeeded = Math.ceil(roundTripMinutes / parseFloat(document.getElementById(`interval_${tabIdx}`).value || 1));

        timeCell.innerText = formatTime(roundTripMinutes);
        
        let horsesHtml = '';
        if (useSzty) horsesHtml += `Sztyeppe: <b>${horsesNeeded}</b> db<br>`;
        if (useMest) horsesHtml += `Mesterlövész: <b>${horsesNeeded}</b> db<br>`;
        if (useMart) horsesHtml += `Martalóc: <b>${horsesNeeded}</b> db<br>`;
        
        horsesCell.innerHTML = horsesHtml;

        updateTotalSummary(tabIdx);
        updateGlobalSummaryCards();
    }

    function onFarmChange(tabIdx, rowIdx, distance) {
        updateFarmRowCalculation(tabIdx, rowIdx, distance, true);
    }

    function updateFarmRowCalculation(tabIdx, rowIdx, distance, shouldSave) {
        const row = document.getElementById(`farm_row_${tabIdx}_${rowIdx}`);
        const coordKey = row.dataset.coordKey;

        const useSzty = document.getElementById(`farm_szty_${tabIdx}_${rowIdx}`).checked;
        const useMest = document.getElementById(`farm_mest_${tabIdx}_${rowIdx}`).checked;
        const useMart = document.getElementById(`farm_mart_${tabIdx}_${rowIdx}`).checked;
        const horseInputVal = parseInt(document.getElementById(`farm_count_${tabIdx}_${rowIdx}`).value) || 1;

        const timeCell = document.getElementById(`farm_time_${tabIdx}_${rowIdx}`);
        const horsesCell = document.getElementById(`farm_horses_${tabIdx}_${rowIdx}`);

        if (!globalAppData[tabIdx]) globalAppData[tabIdx] = {};
        if (!globalAppData[tabIdx].farmConfig) globalAppData[tabIdx].farmConfig = {};
        globalAppData[tabIdx].farmConfig[coordKey] = { szty: useSzty, mest: useMest, mart: useMart, horses: horseInputVal };

        if (shouldSave) saveData();

        if (!useSzty && !useMest && !useMart) {
            timeCell.innerText = 'Válassz egységet!';
            horsesCell.innerText = '-';
            updateTotalSummary(tabIdx);
            updateGlobalSummaryCards();
            return;
        }

        let activeSpeeds = [];
        if (useSzty) activeSpeeds.push(SPEEDS.sztyeppe);
        if (useMest) activeSpeeds.push(SPEEDS.mesterlovesz);
        if (useMart) activeSpeeds.push(SPEEDS.martaloc);

        const slowestSpeed = Math.min(...activeSpeeds);
        const travelTimeMinutes = (distance / slowestSpeed) * 60;
        const roundTripMinutes = travelTimeMinutes * 2;
        const wavesNeeded = Math.ceil(roundTripMinutes / parseFloat(document.getElementById(`interval_${tabIdx}`).value || 1));
        const totalHorsesNeeded = wavesNeeded * horseInputVal;

        timeCell.innerText = formatTime(roundTripMinutes);
        
        let horsesHtml = '';
        if (useSzty) horsesHtml += `Sztyeppe: <b>${totalHorsesNeeded}</b> db <span style="font-size:11px; color:#666">(${wavesNeeded} hullám × ${horseInputVal})</span><br>`;
        if (useMest) horsesHtml += `Mesterlövész: <b>${totalHorsesNeeded}</b> db <span style="font-size:11px; color:#666">(${wavesNeeded} hullám × ${horseInputVal})</span><br>`;
        if (useMart) horsesHtml += `Martalóc: <b>${totalHorsesNeeded}</b> db <span style="font-size:11px; color:#666">(${wavesNeeded} hullám × ${horseInputVal})</span><br>`;
        
        horsesCell.innerHTML = horsesHtml;

        updateTotalSummary(tabIdx);
        updateGlobalSummaryCards();
    }

    function updateTotalSummary(tabIdx) {
        const intervalMin = parseFloat(document.getElementById(`interval_${tabIdx}`).value) || 1;

        // --- Oázis összesítő ---
        const oasisTbody = document.getElementById(`resultsTableBody_oasis_${tabIdx}`);
        let oasisSzty = 0, oasisMest = 0, oasisMart = 0, oasisActive = 0, oasisTotalCount = 0;

        if (oasisTbody) {
            const rows = oasisTbody.getElementsByTagName('tr');
            oasisTotalCount = rows.length;
            for (let row of rows) {
                const rId = row.id.split('_')[3];
                const useSzty = document.getElementById(`oasis_szty_${tabIdx}_${rId}`).checked;
                const useMest = document.getElementById(`oasis_mest_${tabIdx}_${rId}`).checked;
                const useMart = document.getElementById(`oasis_mart_${tabIdx}_${rId}`).checked;

                if (useSzty || useMest || useMart) {
                    oasisActive++;
                    const distance = parseFloat(document.getElementById(`oasis_dist_${tabIdx}_${rId}`).innerText);
                    let activeSpeeds = [];
                    if (useSzty) activeSpeeds.push(SPEEDS.sztyeppe);
                    if (useMest) activeSpeeds.push(SPEEDS.mesterlovesz);
                    if (useMart) activeSpeeds.push(SPEEDS.martaloc);

                    const slowestSpeed = Math.min(...activeSpeeds);
                    const roundTripMinutes = (distance / slowestSpeed) * 60 * 2;
                    const horsesNeeded = Math.ceil(roundTripMinutes / intervalMin);

                    if (useSzty) oasisSzty += horsesNeeded;
                    if (useMest) oasisMest += horsesNeeded;
                    if (useMart) oasisMart += horsesNeeded;
                }
            }
        }

        let oasisSummaryHtml = `<strong>Oázisok:</strong> ${oasisTotalCount} db (Aktív: ${oasisActive} db)<br>`;
        oasisSummaryHtml += `<strong>Szükséges egységek összesen:</strong><br>`;
        if (oasisSzty > 0) oasisSummaryHtml += `- Sztyeppe: <b style="color: #5b7e28; font-size: 15px;">${oasisSzty} db</b><br>`;
        if (oasisMest > 0) oasisSummaryHtml += `- Mesterlövész: <b style="color: #5b7e28; font-size: 15px;">${oasisMest} db</b><br>`;
        if (oasisMart > 0) oasisSummaryHtml += `- Martalóc: <b style="color: #5b7e28; font-size: 15px;">${oasisMart} db</b><br>`;
        if (oasisSzty === 0 && oasisMest === 0 && oasisMart === 0) oasisSummaryHtml += `<span style="color:red;">Nincs aktív oázis egység.</span>`;

        const oasisBox = document.getElementById(`summary_oasis_${tabIdx}`);
        if (oasisBox) oasisBox.innerHTML = oasisSummaryHtml;

        // --- Farm összesítő ---
        const farmTbody = document.getElementById(`resultsTableBody_farm_${tabIdx}`);
        let farmSzty = 0, farmMest = 0, farmMart = 0, farmActive = 0, farmTotalCount = 0;

        if (farmTbody) {
            const rows = farmTbody.getElementsByTagName('tr');
            farmTotalCount = rows.length;
            for (let row of rows) {
                const rId = row.id.split('_')[3];
                const useSzty = document.getElementById(`farm_szty_${tabIdx}_${rId}`).checked;
                const useMest = document.getElementById(`farm_mest_${tabIdx}_${rId}`).checked;
                const useMart = document.getElementById(`farm_mart_${tabIdx}_${rId}`).checked;
                const horseInputVal = parseInt(document.getElementById(`farm_count_${tabIdx}_${rId}`).value) || 1;

                if (useSzty || useMest || useMart) {
                    farmActive++;
                    const distance = parseFloat(document.getElementById(`farm_dist_${tabIdx}_${rId}`).innerText);
                    let activeSpeeds = [];
                    if (useSzty) activeSpeeds.push(SPEEDS.sztyeppe);
                    if (useMest) activeSpeeds.push(SPEEDS.mesterlovesz);
                    if (useMart) activeSpeeds.push(SPEEDS.martaloc);

                    const slowestSpeed = Math.min(...activeSpeeds);
                    const roundTripMinutes = (distance / slowestSpeed) * 60 * 2;
                    const wavesNeeded = Math.ceil(roundTripMinutes / intervalMin);
                    const totalHorsesNeeded = wavesNeeded * horseInputVal;

                    if (useSzty) farmSzty += totalHorsesNeeded;
                    if (useMest) farmMest += totalHorsesNeeded;
                    if (useMart) farmMart += totalHorsesNeeded;
                }
            }
        }

        let farmSummaryHtml = `<strong>Farm faluk:</strong> ${farmTotalCount} db (Aktív: ${farmActive} db)<br>`;
        farmSummaryHtml += `<strong>Szükséges egységek összesen:</strong><br>`;
        if (farmSzty > 0) farmSummaryHtml += `- Sztyeppe: <b style="color: #5b7e28; font-size: 15px;">${farmSzty} db</b><br>`;
        if (farmMest > 0) farmSummaryHtml += `- Mesterlövész: <b style="color: #5b7e28; font-size: 15px;">${farmMest} db</b><br>`;
        if (farmMart > 0) farmSummaryHtml += `- Martalóc: <b style="color: #5b7e28; font-size: 15px;">${farmMart} db</b><br>`;
        if (farmSzty === 0 && farmMest === 0 && farmMart === 0) farmSummaryHtml += `<span style="color:red;">Nincs aktív farm egység.</span>`;

        const farmBox = document.getElementById(`summary_farm_${tabIdx}`);
        if (farmBox) farmBox.innerHTML = farmSummaryHtml;
    }

    function updateGlobalSummaryCards() {
        const grid = document.getElementById('globalSummaryGrid');
        if (!grid) return;
        grid.innerHTML = '';

        for (let i = 0; i < totalTabs; i++) {
            const startX = document.getElementById(`startX_${i}`) ? document.getElementById(`startX_${i}`).value : 0;
            const startY = document.getElementById(`startY_${i}`) ? document.getElementById(`startY_${i}`).value : 0;
            const intervalMin = parseFloat(document.getElementById(`interval_${i}`) ? document.getElementById(`interval_${i}`).value : 6) || 1;

            const oasisTargets = parseCoords(document.getElementById(`targetCoords_${i}`) ? document.getElementById(`targetCoords_${i}`).value : '');
            const farmTargets = parseCoords(document.getElementById(`farmCoords_${i}`) ? document.getElementById(`farmCoords_${i}`).value : '');

            if (oasisTargets.length === 0 && farmTargets.length === 0) {
                continue; 
            }

            let savedUnitsConfig = (globalAppData[i] && globalAppData[i].unitsConfig) ? globalAppData[i].unitsConfig : {};
            let savedFarmConfig = (globalAppData[i] && globalAppData[i].farmConfig) ? globalAppData[i].farmConfig : {};

            let totalSzty = 0, totalMest = 0, totalMart = 0;

            // Számolás oázisokból
            oasisTargets.forEach(target => {
                const coordKey = `${target.x}|${target.y}`;
                let isSzty = true, isMest = false, isMart = false;
                if (savedUnitsConfig[coordKey] !== undefined) {
                    isSzty = !!savedUnitsConfig[coordKey].szty;
                    isMest = !!savedUnitsConfig[coordKey].mest;
                    isMart = !!savedUnitsConfig[coordKey].mart;
                }
                if (isSzty || isMest || isMart) {
                    const dx = startX - target.x;
                    const dy = startY - target.y;
                    const distance = Math.sqrt(dx * dx + dy * dy);
                    let activeSpeeds = [];
                    if (isSzty) activeSpeeds.push(SPEEDS.sztyeppe);
                    if (isMest) activeSpeeds.push(SPEEDS.mesterlovesz);
                    if (isMart) activeSpeeds.push(SPEEDS.martaloc);

                    const roundTripMinutes = (distance / Math.min(...activeSpeeds)) * 60 * 2;
                    const horsesNeeded = Math.ceil(roundTripMinutes / intervalMin);
                    if (isSzty) totalSzty += horsesNeeded;
                    if (isMest) totalMest += horsesNeeded;
                    if (isMart) totalMart += horsesNeeded;
                }
            });

            // Számolás farmokból
            farmTargets.forEach(target => {
                const coordKey = `${target.x}|${target.y}`;
                let isSzty = true, isMest = false, isMart = false, horseCount = 1;
                if (savedFarmConfig[coordKey] !== undefined) {
                    isSzty = !!savedFarmConfig[coordKey].szty;
                    isMest = !!savedFarmConfig[coordKey].mest;
                    isMart = !!savedFarmConfig[coordKey].mart;
                    if (savedFarmConfig[coordKey].horses !== undefined) horseCount = parseInt(savedFarmConfig[coordKey].horses) || 1;
                }
                if (isSzty || isMest || isMart) {
                    const dx = startX - target.x;
                    const dy = startY - target.y;
                    const distance = Math.sqrt(dx * dx + dy * dy);
                    let activeSpeeds = [];
                    if (isSzty) activeSpeeds.push(SPEEDS.sztyeppe);
                    if (isMest) activeSpeeds.push(SPEEDS.mesterlovesz);
                    if (isMart) activeSpeeds.push(SPEEDS.martaloc);

                    const roundTripMinutes = (distance / Math.min(...activeSpeeds)) * 60 * 2;
                    const wavesNeeded = Math.ceil(roundTripMinutes / intervalMin);
                    const totalHorsesNeeded = wavesNeeded * horseCount;
                    if (isSzty) totalSzty += totalHorsesNeeded;
                    if (isMest) totalMest += totalHorsesNeeded;
                    if (isMart) totalMart += totalHorsesNeeded;
                }
            });

            const card = document.createElement('div');
            card.className = 'village-summary-card';
            card.innerHTML = `
                <h4>${i + 1}. Falu (${startX}|${startY})</h4>
                <div><strong>Oázisok:</strong> ${oasisTargets.length} db | <strong>Farmok:</strong> ${farmTargets.length} db</div>
                <div style="margin-top: 4px;"><strong>Összes egységigény:</strong></div>
                ${totalSzty > 0 ? `<div>- Sztyeppe: <span style="color:#5b7e28; font-weight:bold;">${totalSzty} db</span></div>` : ''}
                ${totalMest > 0 ? `<div>- Mesterlövész: <span style="color:#5b7e28; font-weight:bold;">${totalMest} db</span></div>` : ''}
                ${totalMart > 0 ? `<div>- Martalóc: <span style="color:#5b7e28; font-weight:bold;">${totalMart} db</span></div>` : ''}
                ${totalSzty === 0 && totalMest === 0 && totalMart === 0 ? '<div style="color:red;">Nincs aktív egység</div>' : ''}
                <button style="margin-top: 6px; padding: 3px 8px; font-size: 11px; cursor: pointer;" onclick="switchTab(${i})">Ugrás a fülre ➡️</button>
            `;
            grid.appendChild(card);
        }

        if (grid.innerHTML === '') {
            grid.innerHTML = '<div style="color: #666; font-style: italic; grid-column: 1 / -1;">Még nincsenek megadott célpontok egyik falunál sem.</div>';
        }
    }

    function formatTime(totalMinutes) {
        const totalSeconds = Math.round(totalMinutes * 60);
        const hours = Math.floor(totalSeconds / 3600);
        const minutes = Math.floor((totalSeconds % 3600) / 60);
        const seconds = totalSeconds % 60;
        let result = '';
        if (hours > 0) result += hours + 'ó ';
        result += minutes + 'p ' + seconds + 'mp';
        return result;
    }
</script>
