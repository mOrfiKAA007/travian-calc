<!DOCTYPE html>
<html lang="hu">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Travian Oázis Farm Kalkulátor (Online)</title>
    
    <!-- Firebase SDK betöltése -->
    <script src="https://www.gstatic.com/firebasejs/9.22.2/firebase-app-compat.js"></script>
    <script src="https://www.gstatic.com/firebasejs/9.22.2/firebase-database-compat.js"></script>

    <style>
        body { font-family: Arial, sans-serif; background-color: #f4f1ea; color: #333; margin: 0; padding: 15px; }
        .container { max-width: 950px; margin: 0 auto; background: #fff; padding: 15px 20px; border-radius: 8px; box-shadow: 0 4px 8px rgba(0,0,0,0.1); }
        h1, h2 { color: #4a3828; border-bottom: 2px solid #7a6148; padding-bottom: 5px; font-size: 20px; }
        
        /* Fülek stílusa */
        .tabs { display: flex; flex-wrap: wrap; gap: 5px; margin-bottom: 15px; border-bottom: 2px solid #7a6148; padding-bottom: 8px; }
        .tab-btn { background-color: #dcd6cd; border: none; padding: 8px 14px; cursor: pointer; font-weight: bold; border-radius: 4px 4px 0 0; color: #4a3828; font-size: 14px; transition: background-color 0.2s; }
        .tab-btn:hover { background-color: #c8beaf; }
        .tab-btn.active { background-color: #7a6148; color: white; }

        .tab-content { display: none; }
        .tab-content.active { display: block; }

        .section { margin-bottom: 20px; }
        label { font-weight: bold; display: inline-block; margin-bottom: 5px; }
        input[type="number"], textarea { padding: 8px; border: 1px solid #ccc; border-radius: 4px; font-size: 14px; box-sizing: border-box; }
        .inline-inputs { display: flex; gap: 20px; align-items: flex-start; flex-wrap: wrap; }
        .coord-input { width: 60px; }

        textarea { width: 100%; height: 130px; font-family: monospace; resize: vertical; }
        button.calc-btn { background-color: #5b7e28; color: white; padding: 12px 20px; border: none; border-radius: 4px; font-size: 16px; cursor: pointer; font-weight: bold; width: 100%; }
        button.calc-btn:hover { background-color: #48641f; }
        
        table { width: 100%; border-collapse: collapse; margin-top: 15px; font-size: 13px; }
        th, td { border: 1px solid #ddd; padding: 6px 8px; text-align: center; vertical-align: middle; }
        th { background-color: #7a6148; color: white; }
        tr:nth-child(even) { background-color: #f9f9f9; }
        
        .unit-checkboxes-row { display: flex; gap: 10px; justify-content: center; flex-wrap: wrap; font-size: 12px; }
        .unit-checkboxes-row label { font-weight: normal; cursor: pointer; display: flex; align-items: center; gap: 3px; }

        .summary-box { background-color: #e8f0d8; border: 1px solid #b2d281; padding: 12px; border-radius: 5px; margin-top: 15px; font-size: 15px; }
        .help-text { font-size: 12px; color: #666; margin-top: 4px; }
        #syncStatus { font-size: 11px; color: #666; float: right; margin-top: 5px; }
    </style>
</head>
<body onload="initApp()">

<div class="container">
    <h1>Travian Oázis Farm Kalkulátor - by mOrfi <span id="syncStatus">Kapcsolódás...</span></h1>
    
    <!-- Fülek gombjai -->
    <div class="tabs" id="tabButtons">
        <button class="tab-btn active" onclick="switchTab(0)">1. Falu</button>
        <button class="tab-btn" onclick="switchTab(1)">2. Falu</button>
        <button class="tab-btn" onclick="switchTab(2)">3. Falu</button>
        <button class="tab-btn" onclick="switchTab(3)">4. Falu</button>
        <button class="tab-btn" onclick="switchTab(4)">5. Falu</button>
        <button class="tab-btn" onclick="switchTab(5)">6. Falu</button>
        <button class="tab-btn" onclick="switchTab(6)">7. Falu</button>
    </div>

    <!-- A 7 falu konténere -->
    <div id="tabContentsContainer"></div>
</div>

<script>
    // --- IDE ÍRD BE A SAJÁT FIREBASE ADATAIDAT ---
    const firebaseConfig = {
        apiKey: "AIzaSyCsGGSJjxGEkn6Ciid3S9378bifnvmwzGU",
        authDomain: "travian-farm-calc.firebaseapp.com",
        databaseURL: "https://travian-farm-calc-default-rtdb.europe-west1.firebasedatabase.app/",
        projectId: "travian-farm-calc",
        storageBucket: "travian-farm-calc.firebasestorage.app",
        messagingSenderId: "194959845188",
        appId: "G-6167TT4H7S"
    };

    // Firebase inicializálás
    firebase.initializeApp(firebaseConfig);
    const db = firebase.database();
    const dbRef = db.ref('travianData');

    const totalTabs = 7;
    let isRemoteUpdate = false; 
    let globalAppData = []; // Itt tároljuk a betöltött adatokat (beleértve a pipákat is)

    // Sebességek konstansai
    const SPEEDS = {
        sztyeppe: 16,
        mesterlovesz: 15,
        martaloc: 14
    };

    function initApp() {
        const container = document.getElementById('tabContentsContainer');
        container.innerHTML = '';

        for (let i = 0; i < totalTabs; i++) {
            const tabDiv = document.createElement('div');
            tabDiv.className = `tab-content ${i === 0 ? 'active' : ''}`;
            tabDiv.id = `tabContent_${i}`;
            
            tabDiv.innerHTML = `
                <div class="section">
                    <h2>1. Alapbeállítások</h2>
                    <div class="inline-inputs">
                        <div>
                            <label>Start (X|Y):</label><br>
                            <input type="number" id="startX_${i}" class="coord-input" value="0" oninput="saveData()">
                            <input type="number" id="startY_${i}" class="coord-input" value="0" oninput="saveData()">
                        </div>
                        <div>
                            <label for="interval_${i}">Indítás (perc):</label><br>
                            <input type="number" id="interval_${i}" value="6" min="1" style="width: 70px;" oninput="saveData()">
                        </div>
                    </div>
                </div>

                <div class="section">
                    <h2>2. Cél oázisok (max 100 db)</h2>
                    <p class="help-text">Soronként egy koordináta, pl: <b>12|-34</b></p>
                    <textarea id="targetCoords_${i}" placeholder="12|-34&#10;15|-30&#10;-5|20" oninput="saveData()"></textarea>
                </div>

                <button class="calc-btn" onclick="calculate(${i})">Számítás és Táblázat frissítése</button>

                <div class="section" id="resultsSection_${i}" style="display:none;">
                    <h2>3. Eredmények (Egységek kiválasztása oázisonként)</h2>
                    <div class="summary-box" id="summary_${i}"></div>
                    <div style="overflow-x:auto;">
                        <table>
                            <thead>
                                <tr>
                                    <th>#</th>
                                    <th>Cél</th>
                                    <th>Táv (mező)</th>
                                    <th>Küldött egységek (Pipáld ki)</th>
                                    <th>Idő (oda-vissza)</th>
                                    <th>Szükséges lóigény</th>
                                </tr>
                            </thead>
                            <tbody id="resultsTableBody_${i}"></tbody>
                        </table>
                    </div>
                </div>
            `;
            container.appendChild(tabDiv);
        }

        // Valós idejű figyelő beállítása a Firebase-ről
        dbRef.on('value', (snapshot) => {
            const data = snapshot.val();
            if (data) {
                isRemoteUpdate = true;
                globalAppData = data;
                updateFieldsFromData(data);
                isRemoteUpdate = false;
                document.getElementById('syncStatus').innerText = '🟢 Szinkronizálva';
            } else {
                document.getElementById('syncStatus').innerText = '⚪ Nincs még adat';
            }
        }, (error) => {
            document.getElementById('syncStatus').innerText = '🔴 Hiba a kapcsolatban';
            console.error(error);
        });
    }

    function switchTab(index) {
        const buttons = document.querySelectorAll('.tab-btn');
        buttons.forEach((btn, idx) => {
            btn.classList.toggle('active', idx === index);
        });

        const contents = document.querySelectorAll('.tab-content');
        contents.forEach((content, idx) => {
            content.classList.toggle('active', idx === index);
        });
    }

    // Adatok mentése Firebase-be gépelés vagy pipa változás közben
    function saveData() {
        if (isRemoteUpdate) return; 

        const allData = [];
        for (let i = 0; i < totalTabs; i++) {
            // Meglévő mentett pipák összegyűjtése ehhez a fülhöz, ha léteznek
            let unitsConfig = (globalAppData[i] && globalAppData[i].unitsConfig) ? globalAppData[i].unitsConfig : {};

            allData.push({
                startX: document.getElementById(`startX_${i}`).value,
                startY: document.getElementById(`startY_${i}`).value,
                interval: document.getElementById(`interval_${i}`).value,
                targetCoords: document.getElementById(`targetCoords_${i}`).value,
                unitsConfig: unitsConfig
            });
        }
        
        globalAppData = allData;
        dbRef.set(allData).then(() => {
            document.getElementById('syncStatus').innerText = '🟢 Mentve';
        }).catch((error) => {
            document.getElementById('syncStatus').innerText = '🔴 Mentési hiba';
        });
    }

    // Mezők kitöltése a Firebase-ből érkező adatok alapján
    function updateFieldsFromData(allData) {
        allData.forEach((data, i) => {
            if (document.getElementById(`startX_${i}`)) {
                if (data.startX !== undefined) document.getElementById(`startX_${i}`).value = data.startX;
                if (data.startY !== undefined) document.getElementById(`startY_${i}`).value = data.startY;
                if (data.interval !== undefined) document.getElementById(`interval_${i}`).value = data.interval;
                if (data.targetCoords !== undefined) document.getElementById(`targetCoords_${i}`).value = data.targetCoords;
                
                // Ha már volt nyitva eredmény táblázat ezen a fülön, frissítsük automatikusan
                const resultsSection = document.getElementById(`resultsSection_${i}`);
                if (resultsSection && resultsSection.style.display !== 'none') {
                    calculate(i);
                }
            }
        });
    }

    function calculate(i) {
        const startX = parseFloat(document.getElementById(`startX_${i}`).value) || 0;
        const startY = parseFloat(document.getElementById(`startY_${i}`).value) || 0;
        const intervalMin = parseFloat(document.getElementById(`interval_${i}`).value) || 1;

        const rawText = document.getElementById(`targetCoords_${i}`).value;
        const lines = rawText.split('\n');
        const targets = [];
        const coordRegex = /(-?\d+)[\s|,|\/]+(-?\d+)/;

        for (let line of lines) {
            line = line.trim();
            if (!line) continue;
            const match = line.match(coordRegex);
            if (match) {
                targets.push({ x: parseFloat(match[1]), y: parseFloat(match[2]) });
            }
            if (targets.length >= 100) break;
        }

        if (targets.length === 0) { alert('Nem található érvényes koordináta ezen a fülön!'); return; }

        // Előző mentett pipák lekérése a Firebase adatból
        let savedUnitsConfig = (globalAppData[i] && globalAppData[i].unitsConfig) ? globalAppData[i].unitsConfig : {};

        const tbody = document.getElementById(`resultsTableBody_${i}`);
        tbody.innerHTML = '';

        targets.forEach((target, index) => {
            const dx = startX - target.x;
            const dy = startY - target.y;
            const distance = Math.sqrt(dx * dx + dy * dy);

            // Kulcs az oázishoz (pl "41|-2")
            const coordKey = `${target.x}|${target.y}`;
            
            // Alapértelmezés: ha még nincsen mentve semmi ehhez a koordinátához, az első (Sztyeppe) legyen igaz, a többi hamis
            let isSztyChecked = true;
            let isMestChecked = false;
            let isMartChecked = false;

            if (savedUnitsConfig[coordKey] !== undefined) {
                isSztyChecked = !!savedUnitsConfig[coordKey].szty;
                isMestChecked = !!savedUnitsConfig[coordKey].mest;
                isMartChecked = !!savedUnitsConfig[coordKey].mart;
            }

            const row = document.createElement('tr');
            row.id = `row_${i}_${index}`;
            row.dataset.coordKey = coordKey;
            row.innerHTML = `
                <td>${index + 1}</td>
                <td>(${target.x}|${target.y})</td>
                <td id="dist_${i}_${index}">${distance.toFixed(2)}</td>
                <td>
                    <div class="unit-checkboxes-row">
                        <label><input type="checkbox" id="szty_${i}_${index}" ${isSztyChecked ? 'checked' : ''} onchange="onCheckboxChange(${i}, ${index}, ${distance})"> Sztyeppe</label>
                        <label><input type="checkbox" id="mest_${i}_${index}" ${isMestChecked ? 'checked' : ''} onchange="onCheckboxChange(${i}, ${index}, ${distance})"> Mesterlövész</label>
                        <label><input type="checkbox" id="mart_${i}_${index}" ${isMartChecked ? 'checked' : ''} onchange="onCheckboxChange(${i}, ${index}, ${distance})"> Martalóc</label>
                    </div>
                </td>
                <td id="time_${i}_${index}">-</td>
                <td id="horses_${i}_${index}">-</td>
            `;
            tbody.appendChild(row);
            
            updateRowCalculation(i, index, distance, false);
        });

        document.getElementById(`resultsSection_${i}`).style.display = 'block';
        updateTotalSummary(i, targets.length);
    }

    function onCheckboxChange(tabIdx, rowIdx, distance) {
        // Amikor a felhasználó pipál, azonnal frissítjük a sor számítását és mentjük a Firebase-be is
        updateRowCalculation(tabIdx, rowIdx, distance, true);
    }

    function updateRowCalculation(tabIdx, rowIdx, distance, shouldSave) {
        const row = document.getElementById(`row_${tabIdx}_${rowIdx}`);
        const coordKey = row.dataset.coordKey;

        const useSzty = document.getElementById(`szty_${tabIdx}_${rowIdx}`).checked;
        const useMest = document.getElementById(`mest_${tabIdx}_${rowIdx}`).checked;
        const useMart = document.getElementById(`mart_${tabIdx}_${rowIdx}`).checked;

        const timeCell = document.getElementById(`time_${tabIdx}_${rowIdx}`);
        const horsesCell = document.getElementById(`horses_${tabIdx}_${rowIdx}`);

        // Mentés frissítése a memóriában és Firebase-ben
        if (!globalAppData[tabIdx]) globalAppData[tabIdx] = {};
        if (!globalAppData[tabIdx].unitsConfig) globalAppData[tabIdx].unitsConfig = {};
        globalAppData[tabIdx].unitsConfig[coordKey] = { szty: useSzty, mest: useMest, mart: useMart };

        if (shouldSave) {
            saveData();
        }

        if (!useSzty && !useMest && !useMart) {
            timeCell.innerText = 'Válassz egységet!';
            horsesCell.innerText = '-';
            updateTotalSummary(tabIdx);
            return;
        }

        let activeSpeeds = [];
        if (useSzty) activeSpeeds.push(SPEEDS.sztyeppe);
        if (useMest) activeSpeeds.push(SPEEDS.mesterlovesz);
        if (useMart) activeSpeeds.push(SPEEDS.martaloc);

        const slowestSpeed = Math.min(...activeSpeeds);
        const travelTimeHours = distance / slowestSpeed;
        const travelTimeMinutes = travelTimeHours * 60;
        const roundTripMinutes = travelTimeMinutes * 2;
        const horsesNeeded = Math.ceil(roundTripMinutes / parseFloat(document.getElementById(`interval_${tabIdx}`).value || 1));

        timeCell.innerText = formatTime(roundTripMinutes);
        
        let horsesHtml = '';
        if (useSzty) horsesHtml += `Sztyeppe: <b>${horsesNeeded}</b> db<br>`;
        if (useMest) horsesHtml += `Mesterlövész: <b>${horsesNeeded}</b> db<br>`;
        if (useMart) horsesHtml += `Martalóc: <b>${horsesNeeded}</b> db<br>`;
        
        horsesCell.innerHTML = horsesHtml;

        updateTotalSummary(tabIdx);
    }

    function updateTotalSummary(tabIdx, totalTargetsCount) {
        const tbody = document.getElementById(`resultsTableBody_${tabIdx}`);
        if (!tbody) return;
        
        const rows = tbody.getElementsByTagName('tr');
        let totalSzty = 0;
        let totalMest = 0;
        let totalMart = 0;
        let activeRowsCount = 0;

        for (let row of rows) {
            const rId = row.id.split('_')[2];
            const useSzty = document.getElementById(`szty_${tabIdx}_${rId}`).checked;
            const useMest = document.getElementById(`mest_${tabIdx}_${rId}`).checked;
            const useMart = document.getElementById(`mart_${tabIdx}_${rId}`).checked;

            if (useSzty || useMest || useMart) {
                activeRowsCount++;
                const distance = parseFloat(document.getElementById(`dist_${tabIdx}_${rId}`).innerText);
                
                let activeSpeeds = [];
                if (useSzty) activeSpeeds.push(SPEEDS.sztyeppe);
                if (useMest) activeSpeeds.push(SPEEDS.mesterlovesz);
                if (useMart) activeSpeeds.push(SPEEDS.martaloc);

                const slowestSpeed = Math.min(...activeSpeeds);
                const roundTripMinutes = (distance / slowestSpeed) * 60 * 2;
                const horsesNeeded = Math.ceil(roundTripMinutes / parseFloat(document.getElementById(`interval_${tabIdx}`).value || 1));

                if (useSzty) totalSzty += horsesNeeded;
                if (useMest) totalMest += horsesNeeded;
                if (useMart) totalMart += horsesNeeded;
            }
        }

        const count = totalTargetsCount || rows.length;
        let summaryHtml = `<strong>Összes célpont:</strong> ${count} db (Aktív: ${activeRowsCount} db)<br>`;
        summaryHtml += `<strong>Szükséges egységek összesen (lefedéshez):</strong><br>`;
        if (totalSzty > 0) summaryHtml += `- Sztyeppe: <b style="color: #5b7e28; font-size: 16px;">${totalSzty} db</b><br>`;
        if (totalMest > 0) summaryHtml += `- Mesterlövész: <b style="color: #5b7e28; font-size: 16px;">${totalMest} db</b><br>`;
        if (totalMart > 0) summaryHtml += `- Martalóc: <b style="color: #5b7e28; font-size: 16px;">${totalMart} db</b><br>`;
        if (totalSzty === 0 && totalMest === 0 && totalMart === 0) summaryHtml += `<span style="color:red;">Nincs aktív egység kiválasztva.</span>`;

        const summaryBox = document.getElementById(`summary_${tabIdx}`);
        if (summaryBox) summaryBox.html = summaryBox.innerHTML = summaryHtml; // Javítva
    }

    function formatTime(totalMinutes) {
        const totalSeconds = Math.round(totalMinutes * 60);
        const hours = Math.floor(totalSeconds / 3600);
        const minutes = Math.floor((totalSeconds % 3600) / 60);
        const seconds = totalSeconds % 60;
        let result = '';
        if (hours > 0) result += hours + 'ó ';
        result += minutes + 'p ' + seconds + 'mp';
        return result;
    }
</script>

</body>
</html>
